server {
    listen 80;
    server_name _;

    # Health check endpoint for docker orchestrators
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Validate all playback requests against the middleware before proxying
    location /stream/ {
        auth_request /_validate;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://audiobookshelf;
    }

    # Subrequest executed by auth_request to validate signatures and device state
    location = /_validate {
        internal;
        proxy_pass http://middleware:8000/api/v1/proxy/validate?$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Uri $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
